<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../tailwind-build.css" />
  </head>
  <body class="tw:px-4">
    <h3 class="tw:text-2xl">Hello World</h3>
    <p></p>
    <script></script>
    <div
      class="tw:flex tw:bg-blue-500 tw:pt-4 tw:text-2xl tw:text-white tw:hover:bg-blue-600"
    >
      For prettierrc test
    </div>
    <div class="tw:mx-auto tw:my-4 tw:w-[320px] tw:space-y-4">
      <h4 class="tw:text-2xl">Shipping Info</h4>
      <div class="tw:group tw:is-error tw:space-y-1.5">
        <div class="tw:flex tw:justify-between">
          <label
            class="tw:text-secondary group-[.is-error]:tw:text-error tw:block tw:text-sm tw:font-semibold"
            >User Name<sup>*</sup></label
          >
        </div>
        <input
          type="text"
          placeholder="enter your user name"
          class="tw:text-primary group-[.is-error]:tw:border-error group-[.is-error]:tw:bg-error-bg read-only:tw:pointer-events-none read-only:tw:focus-within-select-none read-only:focus-within:tw:outline-none read-only:focus-within:tw:offset-none tw:block tw:h-[40px] tw:w-full tw:appearance-none tw:rounded-none! tw:border tw:border-[rgba(193,198,214,0.40)] tw:p-2 tw:text-base tw:leading-6 tw:outline-none"
        />
        <p class="tw:text-error group-[.is-error]:tw:block tw:hidden">
          please enter correct message
        </p>
      </div>
      <div class="tw:group tw:space-y-1.5">
        <div class="tw:flex tw:justify-between">
          <label
            class="tw:text-secondary group-[.is-error]:tw:text-error tw:block tw:text-sm tw:font-semibold"
            >Email<sup>*</sup></label
          >
        </div>
        <input
          type="text"
          placeholder="enter your email"
          class="tw:text-primary group-[.is-error]:tw:border-error group-[.is-error]:tw:bg-error-bg read-only:tw:pointer-events-none read-only:tw:select-none read-only:focus:tw:outline-none tw:block tw:h-[40px] tw:w-full tw:appearance-none tw:border tw:border-[rgba(193,198,214,0.40)] tw:p-2 tw:text-base tw:leading-6 tw:outline-none"
        />
        <p class="tw:text-error group-[.is-error]:tw:block tw:hidden">
          please enter correct message
        </p>
      </div>

      <div class="tw:my-5 tw:flex tw:gap-x-4">
        <div class="tw:flex tw:items-center tw:gap-x-1.5">
          <span class="tw:order-last">Yes</span>
          <input
            checked
            class="tw:peer tw:h-4 tw:w-4"
            hidden=""
            id="default-radio3"
            name="valuex"
            type="radio"
          />
          <label
            class="peer-checked:before:tw:hidden before:tw:block before:tw:absolute before:tw:w-full before:tw:h-full before:tw:bg-white peer-checked:tw:bg-blue tw:relative tw:flex tw:size-4 tw:cursor-pointer tw:items-center tw:justify-center tw:overflow-hidden tw:rounded-full tw:border-2 tw:border-[rgba(193,198,214,0.40)] tw:p-0.5"
            for="default-radio3"
          >
            <span
              class="tw:block tw:size-1.5 tw:rounded-full tw:bg-white"
            ></span>
          </label>
        </div>
        <div class="tw:flex tw:items-center tw:gap-x-1.5">
          <span class="tw:order-last">No</span>
          <input
            class="tw:peer tw:h-4 tw:w-4"
            hidden=""
            id="default-radio4"
            name="valuex"
            type="radio"
          />
          <label
            class="peer-checked:before:tw:hidden before:tw:block before:tw:absolute before:tw:w-full before:tw:h-full before:tw:bg-white peer-checked:tw:bg-blue tw:relative tw:flex tw:size-4 tw:cursor-pointer tw:items-center tw:justify-center tw:overflow-hidden tw:rounded-full tw:border-2 tw:border-[rgba(193,198,214,0.40)] tw:p-0.5"
            for="default-radio4"
          >
            <span
              class="tw:block tw:size-1.5 tw:rounded-full tw:bg-white"
            ></span>
          </label>
        </div>
      </div>
    </div>
  </body>
</html>
